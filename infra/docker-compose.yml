version: '3.8'

services:
  # Frontend Next.js
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - backend
    networks:
      - nucleo-tatico-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - nucleo-tatico-network
    restart: unless-stopped

  # Apache Superset para Dashboard
  superset:
    image: apache/superset:latest
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - SUPERSET_DATABASE_URI=postgresql://superset:superset@superset-db:5432/superset
    depends_on:
      - superset-db
      - superset-redis
    volumes:
      - superset-data:/app/superset_home
    networks:
      - nucleo-tatico-network
    restart: unless-stopped
    command: >
      sh -c "
        superset db upgrade &&
        superset init &&
        superset run -p 8088 --with-threads --reload --debugger
      "

  # Banco de dados do Superset
  superset-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=superset
      - POSTGRES_PASSWORD=superset
      - POSTGRES_DB=superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    networks:
      - nucleo-tatico-network
    restart: unless-stopped

  # Redis para Superset
  superset-redis:
    image: redis:7
    networks:
      - nucleo-tatico-network
    restart: unless-stopped

  # Airbyte para ETL
  airbyte:
    image: airbyte/server:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://airbyte:airbyte@airbyte-db:5432/airbyte
      - WORKSPACE_ROOT=/tmp/workspace
    depends_on:
      - airbyte-db
    volumes:
      - airbyte-data:/tmp/workspace
      - ./airbyte/configuration:/tmp/configuration
    networks:
      - nucleo-tatico-network
    restart: unless-stopped

  # Banco de dados do Airbyte
  airbyte-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=airbyte
      - POSTGRES_PASSWORD=airbyte
      - POSTGRES_DB=airbyte
    volumes:
      - airbyte-db-data:/var/lib/postgresql/data
    networks:
      - nucleo-tatico-network
    restart: unless-stopped

  # Nginx como proxy reverso
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
      - superset
      - airbyte
    networks:
      - nucleo-tatico-network
    restart: unless-stopped

  # WeasyPrint para geração de PDFs
  weasyprint:
    build:
      context: ../scripts
      dockerfile: Dockerfile.weasyprint
    volumes:
      - ../scripts:/app
      - pdf-output:/app/output
    networks:
      - nucleo-tatico-network
    restart: unless-stopped

networks:
  nucleo-tatico-network:
    driver: bridge

volumes:
  superset-data:
  superset-db-data:
  airbyte-data:
  airbyte-db-data:
  pdf-output:
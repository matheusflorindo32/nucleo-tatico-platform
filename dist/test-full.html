<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Núcleo Tático - Teste</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{text-align:center;padding:2rem}
h1{font-size:2.5rem;background:linear-gradient(135deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
p{color:#94a3b8;font-size:1.1rem;margin-bottom:2rem}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:1rem;padding:2rem;max-width:400px;margin:0 auto}
.card h2{color:#e2e8f0;margin-bottom:1rem}
.btn{display:inline-block;padding:.75rem 2rem;border-radius:.5rem;background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff;text-decoration:none;font-weight:600;margin-top:1rem;transition:transform .2s}
.btn:hover{transform:scale(1.05)}
.status{color:#22c55e;font-size:.9rem;margin-top:1rem}
</style>
</head>
<body>
<div class="container">
<h1>⚡ Núcleo Tático</h1>
<p>Servidor funcionando perfeitamente!</p>
<div class="card">
<h2>🔌 Túnel Cloudflare</h2>
<p style="font-size:2rem;margin:1rem 0">✅</p>
<p class="status">● Online — Conexão estabelecida</p>
<a href="/" class="btn">Ir para o App</a>
</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Núcleo Tático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ========== RESET & BASE ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0a0a0f;
  color:#e4e4e7;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
  overflow-x:hidden;
  position:relative;
}

/* ========== ANIMATED BACKGROUND GRID ========== */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px);
  background-size:60px 60px;
  z-index:0;
  pointer-events:none;
}

/* ========== ORB GLOW ========== */
.orb{
  position:fixed;
  width:600px;height:600px;
  border-radius:50%;
  filter:blur(120px);
  opacity:.12;
  pointer-events:none;
  z-index:0;
}
.orb-1{
  background:#6366f1;
  top:-200px;right:-200px;
  animation:orbFloat 20s ease-in-out infinite;
}
.orb-2{
  background:#8b5cf6;
  bottom:-250px;left:-250px;
  animation:orbFloat 25s ease-in-out infinite reverse;
}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-30px) scale(1.1)}
  66%{transform:translate(-20px,20px) scale(.95)}
}

/* ========== CONTAINER ========== */
.container{
  position:relative;z-index:1;
  width:100%;max-width:440px;
}

/* ========== SOCIAL PROOF ========== */
.social-proof{
  text-align:center;margin-bottom:2rem;
}
.social-proof .logo{
  display:inline-flex;align-items:center;gap:.75rem;
  margin-bottom:1rem;
}
.social-proof .logo-icon{
  width:44px;height:44px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:800;color:#fff;
  box-shadow:0 0 20px rgba(99,102,241,.35);
}
.social-proof h1{
  font-size:1.5rem;font-weight:700;
  letter-spacing:-.03em;
}
.social-proof .badge{
  display:inline-flex;align-items:center;gap:.4rem;
  margin-top:.75rem;
  padding:.35rem .85rem;
  border-radius:100px;
  background:rgba(99,102,241,.1);
  border:1px solid rgba(99,102,241,.2);
  font-size:.8rem;font-weight:500;color:#a5b4fc;
}
.social-proof .badge svg{width:14px;height:14px;flex-shrink:0}

/* ========== CARD ========== */
.card{
  background:#12121a;
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;
  padding:2rem 1.75rem;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:
    0 0 0 1px rgba(99,102,241,.05),
    0 0 40px rgba(99,102,241,.04),
    0 20px 60px rgba(0,0,0,.4);
  position:relative;
  overflow:hidden;
  transition:box-shadow .3s;
}
.card::before{
  content:'';
  position:absolute;inset:0;
  border-radius:20px;
  padding:1px;
  background:linear-gradient(135deg,rgba(99,102,241,.15),transparent 50%,rgba(139,92,246,.08));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}

/* ========== TABS ========== */
.tabs{
  display:flex;gap:0;margin-bottom:1.75rem;
  background:rgba(255,255,255,.04);
  border-radius:12px;padding:4px;
  position:relative;
}
.tab-btn{
  flex:1;padding:.65rem 0;
  border:none;background:transparent;
  color:#71717a;font-size:.875rem;font-weight:500;
  cursor:pointer;border-radius:9px;
  transition:color .3s,background .3s;
  position:relative;z-index:1;
  font-family:'Inter',sans-serif;
}
.tab-btn.active{color:#e4e4e7}
.tab-slider{
  position:absolute;top:4px;bottom:4px;
  width:calc(50% - 4px);border-radius:9px;
  background:rgba(99,102,241,.15);
  transition:transform .35s cubic-bezier(.45,.05,.4,1);
  z-index:0;
}
.tab-slider.right{transform:translateX(calc(100% + 4px))}

/* ========== FORM PANELS ========== */
.panel-wrapper{position:relative;overflow:hidden}
.panel{
  display:none;
  animation:panelIn .35s cubic-bezier(.45,.05,.4,1);
}
.panel.active{display:block}
@keyframes panelIn{
  from{opacity:0;transform:translateY(8px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ========== FORM ELEMENTS ========== */
.form-group{margin-bottom:1.125rem}
.form-group label{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;font-weight:500;
  text-transform:uppercase;letter-spacing:.06em;
  color:#71717a;margin-bottom:.4rem;
}
.input-wrap{position:relative}
.input-wrap input{
  width:100%;padding:.75rem 1rem;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  color:#e4e4e7;font-size:.9rem;
  font-family:'Inter',sans-serif;
  outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
.input-wrap input::placeholder{color:#3f3f46}
.input-wrap input:focus{
  border-color:#6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,.12),0 0 20px rgba(99,102,241,.05);
  background:rgba(255,255,255,.06);
}
.input-wrap.error input{
  border-color:#ef4444;
  box-shadow:0 0 0 3px rgba(239,68,68,.1);
}
.error-msg{
  font-size:.72rem;color:#ef4444;
  margin-top:.3rem;display:none;
  font-weight:500;
}
.error-msg.show{display:block}
.shake{animation:shake .4s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

/* ========== PASSWORD TOGGLE ========== */
.pwd-toggle{
  position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
  background:none;border:none;color:#52525b;cursor:pointer;
  padding:4px;border-radius:6px;
  transition:color .2s;
  line-height:0;
}
.pwd-toggle:hover{color:#a1a1aa}
.pwd-toggle svg{width:18px;height:18px}

/* ========== SUBMIT BUTTON ========== */
.btn-submit{
  width:100%;padding:.85rem;
  border:none;border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#4f46e5);
  color:#fff;font-size:.9rem;font-weight:600;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s,opacity .2s;
  position:relative;overflow:hidden;
  margin-top:.5rem;
}
.btn-submit:hover{
  transform:scale(1.02);
  box-shadow:0 4px 24px rgba(99,102,241,.35);
}
.btn-submit:active{transform:scale(.98)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-submit .btn-text{transition:opacity .2s}
.btn-submit.loading .btn-text{opacity:0}
.btn-submit.loading .spinner{opacity:1}

/* ========== SPINNER ========== */
.spinner{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  opacity:0;transition:opacity .2s;
}
.spinner::after{
  content:'';display:block;
  width:20px;height:20px;
  border:2px solid rgba(255,255,255,.25);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ========== LINKS ========== */
.forgot-link{
  display:block;text-align:right;
  font-size:.78rem;color:#71717a;
  text-decoration:none;margin:.3rem 0 .5rem;
  transition:color .2s;
}
.forgot-link:hover{color:#a1a1aa}

/* ========== DEMO CREDENTIALS ========== */
.demo-note{
  margin-top:1.25rem;
  padding:.6rem .85rem;
  background:rgba(99,102,241,.06);
  border:1px solid rgba(99,102,241,.12);
  border-radius:10px;
  font-size:.75rem;color:#71717a;text-align:center;
  line-height:1.5;
}
.demo-note code{
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;color:#a5b4fc;
  background:rgba(99,102,241,.08);
  padding:.1rem .35rem;border-radius:4px;
}
.demo-note .demo-btn{
  display:inline-block;
  margin-top:.3rem;padding:.25rem .65rem;
  background:rgba(99,102,241,.1);
  border:1px solid rgba(99,102,241,.2);
  border-radius:6px;color:#a5b4fc;
  font-size:.7rem;cursor:pointer;
  transition:background .2s;
  font-family:'JetBrains Mono',monospace;
}
.demo-note .demo-btn:hover{background:rgba(99,102,241,.18)}

/* ========== FOOTER ========== */
.footer-text{
  margin-top:1.5rem;text-align:center;
  font-size:.75rem;color:#52525b;
}

/* ========== RESPONSIVE ========== */
@media(max-width:480px){
  body{padding:.75rem}
  .card{padding:1.5rem 1.25rem;border-radius:16px}
  .social-proof h1{font-size:1.25rem}
  .tab-btn{font-size:.8rem;padding:.55rem 0}
}
</style>
</head>
<body>

<!-- Orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">

  <!-- Social proof -->
  <div class="social-proof">
    <div class="logo">
      <div class="logo-icon">NT</div>
      <h1>Núcleo Tático</h1>
    </div>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      220+ questões disponíveis
    </div>
  </div>

  <!-- Card -->
  <div class="card">

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <div class="tab-slider" id="tabSlider"></div>
      <button class="tab-btn active" data-tab="login" role="tab" aria-selected="true">Entrar</button>
      <button class="tab-btn" data-tab="register" role="tab" aria-selected="false">Cadastrar</button>
    </div>

    <!-- Panel wrapper -->
    <div class="panel-wrapper">

      <!-- ======== LOGIN PANEL ======== -->
      <div class="panel active" id="panelLogin" role="tabpanel">
        <form id="loginForm" autocomplete="off" novalidate>
          <div class="form-group">
            <label>Email</label>
            <div class="input-wrap">
              <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
            </div>
            <div class="error-msg" id="loginEmailError"></div>
          </div>
          <div class="form-group">
            <label>Senha</label>
            <div class="input-wrap">
              <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="pwd-toggle" data-toggle="loginPassword" aria-label="Alternar visibilidade da senha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="error-msg" id="loginPasswordError"></div>
          </div>
          <a href="#" class="forgot-link">Esqueci a senha</a>
          <button type="submit" class="btn-submit" id="loginBtn">
            <span class="btn-text">Entrar</span>
            <span class="spinner"></span>
          </button>
        </form>
        <div class="demo-note">
          <div>🔑 Conta de demonstração</div>
          <code>admin@nucleotatico.com</code> / <code>Demo@1234</code>
          <div><button type="button" class="demo-btn" id="fillDemo">Preencher demo</button></div>
        </div>
      </div>

      <!-- ======== REGISTER PANEL ======== -->
      <div class="panel" id="panelRegister" role="tabpanel">
        <form id="registerForm" autocomplete="off" novalidate>
          <div class="form-group">
            <label>Nome</label>
            <div class="input-wrap">
              <input type="text" id="regName" placeholder="Seu nome">
            </div>
            <div class="error-msg" id="regNameError"></div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <div class="input-wrap">
              <input type="email" id="regEmail" placeholder="seu@email.com">
            </div>
            <div class="error-msg" id="regEmailError"></div>
          </div>
          <div class="form-group">
            <label>Senha</label>
            <div class="input-wrap">
              <input type="password" id="regPassword" placeholder="Mín. 8 caracteres">
              <button type="button" class="pwd-toggle" data-toggle="regPassword" aria-label="Alternar visibilidade da senha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="error-msg" id="regPasswordError"></div>
          </div>
          <div class="form-group">
            <label>Confirmar Senha</label>
            <div class="input-wrap">
              <input type="password" id="regConfirm" placeholder="Repita a senha">
              <button type="button" class="pwd-toggle" data-toggle="regConfirm" aria-label="Alternar visibilidade da senha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="error-msg" id="regConfirmError"></div>
          </div>
          <button type="submit" class="btn-submit" id="registerBtn">
            <span class="btn-text">Criar Conta</span>
            <span class="spinner"></span>
          </button>
        </form>
      </div>

    </div><!-- /panel-wrapper -->

  </div><!-- /card -->

  <div class="footer-text">© 2026 Núcleo Tático. Todos os direitos reservados.</div>
</div>

<script>
/* =================================================================
   Núcleo Tático — Login / Cadastro
   ================================================================= */

(function(){
  'use strict';

  // ---------- DOM refs ----------
  const tabBtns     = document.querySelectorAll('.tab-btn');
  const tabSlider   = document.getElementById('tabSlider');
  const panelLogin  = document.getElementById('panelLogin');
  const panelReg    = document.getElementById('panelRegister');
  const loginForm   = document.getElementById('loginForm');
  const regForm     = document.getElementById('registerForm');

  const loginEmail    = document.getElementById('loginEmail');
  const loginPass     = document.getElementById('loginPassword');
  const regName       = document.getElementById('regName');
  const regEmail      = document.getElementById('regEmail');
  const regPass       = document.getElementById('regPassword');
  const regConfirm    = document.getElementById('regConfirm');

  const loginEmailErr   = document.getElementById('loginEmailError');
  const loginPassErr    = document.getElementById('loginPasswordError');
  const regNameErr      = document.getElementById('regNameError');
  const regEmailErr     = document.getElementById('regEmailError');
  const regPassErr      = document.getElementById('regPasswordError');
  const regConfirmErr   = document.getElementById('regConfirmError');

  const loginBtn      = document.getElementById('loginBtn');
  const registerBtn   = document.getElementById('registerBtn');
  const fillDemoBtn   = document.getElementById('fillDemo');

  // ---------- Helpers ----------
  const $ = (sel, ctx=document) => ctx.querySelector(sel);
  const showErr = (el, msg) => {
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  };
  const clearErr = (el) => { el.textContent = ''; el.classList.remove('show'); };
  const setErrorState = (wrap, isErr) => {
    wrap.classList.toggle('error', isErr);
  };
  const shakeEl = (el) => {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  };

  // ---------- Tabs ----------
  let currentTab = 'login';

  function switchTab(tab){
    if(tab === currentTab) return;
    currentTab = tab;

    // tab buttons
    tabBtns.forEach(b => {
      const isActive = b.dataset.tab === tab;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-selected', isActive);
    });

    // slider
    tabSlider.classList.toggle('right', tab === 'register');

    // panels
    panelLogin.classList.toggle('active', tab === 'login');
    panelReg.classList.toggle('active', tab === 'register');

    // clear validation artifacts
    document.querySelectorAll('.error-msg').forEach(e => clearErr(e));
    document.querySelectorAll('.input-wrap').forEach(w => w.classList.remove('error'));
  }

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // ---------- Password toggle ----------
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = document.getElementById(btn.dataset.toggle);
      if(!inp) return;
      const isPass = inp.type === 'password';
      inp.type = isPass ? 'text' : 'password';
    });
  });

  // ---------- Validation ----------
  function validateEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function validatePassword(v){ return v.length >= 8; }

  function validateLogin(){
    let valid = true;
    const em = loginEmail.value.trim();
    const pw = loginPass.value;

    if(!em){ showErr(loginEmailErr,'Email é obrigatório'); setErrorState(loginEmail.parentElement, true); valid=false; }
    else if(!validateEmail(em)){ showErr(loginEmailErr,'Email inválido'); setErrorState(loginEmail.parentElement, true); valid=false; }
    else { clearErr(loginEmailErr); setErrorState(loginEmail.parentElement, false); }

    if(!pw){ showErr(loginPassErr,'Senha é obrigatória'); setErrorState(loginPass.parentElement, true); valid=false; }
    else { clearErr(loginPassErr); setErrorState(loginPass.parentElement, false); }

    return valid;
  }

  function validateRegister(){
    let valid = true;
    const nm = regName.value.trim();
    const em = regEmail.value.trim();
    const pw = regPass.value;
    const cf = regConfirm.value;

    if(!nm){ showErr(regNameErr,'Nome é obrigatório'); setErrorState(regName.parentElement, true); valid=false; }
    else if(nm.length < 2){ showErr(regNameErr,'Nome deve ter pelo menos 2 caracteres'); setErrorState(regName.parentElement, true); valid=false; }
    else { clearErr(regNameErr); setErrorState(regName.parentElement, false); }

    if(!em){ showErr(regEmailErr,'Email é obrigatório'); setErrorState(regEmail.parentElement, true); valid=false; }
    else if(!validateEmail(em)){ showErr(regEmailErr,'Email inválido'); setErrorState(regEmail.parentElement, true); valid=false; }
    else { clearErr(regEmailErr); setErrorState(regEmail.parentElement, false); }

    if(!pw){ showErr(regPassErr,'Senha é obrigatória'); setErrorState(regPass.parentElement, true); valid=false; }
    else if(!validatePassword(pw)){ showErr(regPassErr,'Mínimo 8 caracteres'); setErrorState(regPass.parentElement, true); valid=false; }
    else { clearErr(regPassErr); setErrorState(regPass.parentElement, false); }

    if(!cf){ showErr(regConfirmErr,'Confirme a senha'); setErrorState(regConfirm.parentElement, true); valid=false; }
    else if(cf !== pw){ showErr(regConfirmErr,'Senhas não conferem'); setErrorState(regConfirm.parentElement, true); valid=false; }
    else { clearErr(regConfirmErr); setErrorState(regConfirm.parentElement, false); }

    return valid;
  }

  // ---------- Loading state ----------
  function setLoading(btn, loading){
    btn.classList.toggle('loading', loading);
    btn.disabled = loading;
  }

  // ---------- localStorage ----------
  function getUsers(){ 
    try { return JSON.parse(localStorage.getItem('nucleo_usuarios')) || {}; } 
    catch { return {}; }
  }
  function saveUsers(u){ localStorage.setItem('nucleo_usuarios', JSON.stringify(u)); }
  function setSession(email){
    localStorage.setItem('nucleo_session', JSON.stringify({
      email, loggedAt: Date.now()
    }));
  }
  function sessionExists(){
    try { return !!localStorage.getItem('nucleo_session'); } catch { return false; }
  }

  // ---------- Seed demo user ----------
  (function seedDemo(){
    const users = getUsers();
    if(!users['admin@nucleotatico.com']){
      users['admin@nucleotatico.com'] = {
        name: 'Admin',
        email: 'admin@nucleotatico.com',
        password: 'Demo@1234',
        createdAt: Date.now()
      };
      saveUsers(users);
    }
  })();

  // ---------- Login handler ----------
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(!validateLogin()){
      shakeEl(loginForm);
      return;
    }
    setLoading(loginBtn, true);

    // simulate network
    await new Promise(r => setTimeout(r, 800));

    const em = loginEmail.value.trim();
    const pw = loginPass.value;
    const users = getUsers();
    const user = users[em];

    if(!user || user.password !== pw){
      showErr(loginEmailErr, 'Email ou senha incorretos');
      setErrorState(loginEmail.parentElement, true);
      showErr(loginPassErr, '');
      setErrorState(loginPass.parentElement, true);
      shakeEl(loginForm);
      setLoading(loginBtn, false);
      return;
    }

    // success
    setSession(em);
    setLoading(loginBtn, false);
    window.location.href = '/dashboard';
  });

  // ---------- Register handler ----------
  regForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(!validateRegister()){
      shakeEl(regForm);
      return;
    }
    setLoading(registerBtn, true);
    await new Promise(r => setTimeout(r, 800));

    const nm = regName.value.trim();
    const em = regEmail.value.trim();
    const pw = regPass.value;
    const users = getUsers();

    if(users[em]){
      showErr(regEmailErr, 'Este email já está cadastrado');
      setErrorState(regEmail.parentElement, true);
      shakeEl(regForm);
      setLoading(registerBtn, false);
      return;
    }

    // save
    users[em] = { name: nm, email: em, password: pw, createdAt: Date.now() };
    saveUsers(users);
    setSession(em);
    setLoading(registerBtn, false);
    window.location.href = '/dashboard';
  });

  // ---------- Fill demo ----------
  fillDemoBtn.addEventListener('click', () => {
    loginEmail.value = 'admin@nucleotatico.com';
    loginPass.value = 'Demo@1234';
    // clear errors
    clearErr(loginEmailErr);
    clearErr(loginPassErr);
    setErrorState(loginEmail.parentElement, false);
    setErrorState(loginPass.parentElement, false);
    // switch to login
    switchTab('login');
  });

  // ---------- Auto-clear errors on input ----------
  [loginEmail, loginPass].forEach(inp => {
    inp.addEventListener('input', () => {
      const err = inp.id === 'loginEmail' ? loginEmailErr : loginPassErr;
      clearErr(err);
      setErrorState(inp.parentElement, false);
    });
  });
  [regName, regEmail, regPass, regConfirm].forEach(inp => {
    inp.addEventListener('input', () => {
      const map = {
        regName: regNameErr, regEmail: regEmailErr,
        regPassword: regPassErr, regConfirm: regConfirmErr
      };
      clearErr(map[inp.id]);
      setErrorState(inp.parentElement, false);
    });
  });

  // ---------- Redirect if already logged in ----------
  if(sessionExists()){
    window.location.href = '/dashboard';
  }

})();
</script>
</body>
</html>
